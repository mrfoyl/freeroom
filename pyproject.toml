[project]
name = "freeroom"
version = "0.1.0"
description = "Local GPU AI photo noise reduction with a 100% loupe preview."
requires-python = ">=3.12,<3.13"
dependencies = [
    "spandrel>=0.4",
    "spandrel-extra-arches>=0.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "rawpy>=0.22",
    "tifffile>=2024.8",
    "imagecodecs>=2024.6",
    "PySide6>=6.7",
]

# PyTorch build, pick exactly one (setup/install.sh does this by itself):
#   uv sync --extra cu128   NVIDIA GPU (CUDA 12.8)
#   uv sync --extra cpu     anything else (much smaller download)
[project.optional-dependencies]
cpu = ["torch==2.8.*", "torchvision==0.23.*"]
cu128 = ["torch==2.8.*", "torchvision==0.23.*"]

[project.scripts]
freeroom = "freeroom.app:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
